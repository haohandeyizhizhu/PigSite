<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F3EFEC" />
<title>养小猪</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M30 44 C24 32 20 22 19 16 C31 15 45 25 53 36 Z' fill='%23D98D9E'/><path d='M70 44 C76 32 80 22 81 16 C69 15 55 25 47 36 Z' fill='%23D98D9E'/><circle cx='50' cy='56' r='38' fill='%23E8AEB8'/><circle cx='36' cy='48' r='4.5' fill='%234A3C42'/><circle cx='64' cy='48' r='4.5' fill='%234A3C42'/><ellipse cx='50' cy='68' rx='15' ry='11' fill='%23D98D9E'/><ellipse cx='45' cy='68' rx='2.4' ry='3.6' fill='%23A8687B'/><ellipse cx='55' cy='68' rx='2.4' ry='3.6' fill='%23A8687B'/></svg>" />
<style>
  /* ======================= 1. 变量 ======================= */
  :root {
    /* 明确声明只支持浅色：避免浏览器/深色插件对 <button> 等表单控件做自动暗色改写，
       那会把按钮底色换掉、只剩白字 → 看起来就是「按钮不见了」 */
    color-scheme: light;
    --bg:        #F3EFEC;
    --stage:     #FFFFFF;
    --ink:       #3A3238;
    --ink-2:     #8C8188;
    --ink-3:     #B5ABA9;
    --line:      #EAE4E0;
    --line-2:    #DBD3CE;

    --pig:       #E8AEB8;
    --pig-2:     #D98D9E;
    --pig-line:  #B97A8B;
    --pig-dark:  #4A3C42;

    --satiety:   #D98D9E;
    --mood:      #9DC0AE;

    --r:         18px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  /* ======================= 2. 基础 ======================= */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font-family: inherit; font-size: 15px; cursor: pointer;
    border: 1px solid var(--line-2); background: #fff; color: var(--ink);
    border-radius: 14px; padding: 14px 8px; font-weight: 600;
    transition: transform .12s, background .18s, border-color .18s, opacity .18s;
    user-select: none; touch-action: manipulation;
  }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; }

  /* ======================= 3. 外壳（一屏，不滚动） ======================= */
  .app {
    height: 100vh; max-height: 100vh;
    height: 100dvh; max-height: 100dvh;
    overflow-y: auto; overflow-x: hidden;
    max-width: 460px; margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }

  /* ==== 顶部 ==== */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top__name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .top__meta { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .top__reset {
    font-size: 12.5px; color: var(--ink-2); padding: 7px 12px;
    border-radius: 10px; border-color: var(--line); font-weight: 500;
  }

  /* ==== 数值 ==== */
  .stats { display: grid; grid-template-columns: 1fr 1fr 74px; gap: 16px; align-items: end; }
  .stat__row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .stat__label { font-size: 12.5px; color: var(--ink-2); }
  .stat__val { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width .35s ease-out; }
  /* 进度条填充同理：底色被抹掉就等于「这条是空的」，也会误导读数，一起钉死 */
  #satietyBar { display: block !important; background: var(--satiety, #D98D9E) !important; }
  #moodBar    { display: block !important; background: var(--mood, #9DC0AE) !important; }
  .stat--weight { text-align: right; }
  .stat__num { font-size: 21px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat__num small { font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }

  /* ==== 舞台 ==== */
  .stage {
    position: relative; flex: 1; min-height: 180px;
    background: var(--stage); border-radius: 24px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 26px;
  }
  .cloud {
    position: absolute; top: 34px; left: 34px; width: 54px; height: 18px;
    background: #F1EDEA; border-radius: 99px;
    animation: drift 9s ease-in-out infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 24px; height: 24px; left: 8px; bottom: 4px; }
  .cloud::after  { width: 16px; height: 16px; left: 27px; bottom: 3px; }
  @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(16px); } }

  /* ==== 小猪 ==== */
  .pig-wrap {
    position: relative; width: min(228px, 60vw);
    transform: scaleX(var(--fat, 1)); transform-origin: 50% 100%;
    transition: transform .6s ease-out;
  }
  .pig-wrap::after {
    content: ""; position: absolute; left: 50%; bottom: 3%; width: 58%; height: 10px;
    transform: translateX(-50%); background: rgba(74,60,66,.07);
    border-radius: 50%; filter: blur(3px);
  }
  .pig__bob { animation: breathe 3.6s ease-in-out infinite; }
  .pig__bob svg { display: block; width: 100%; height: auto; aspect-ratio: 200 / 214; position: relative; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-5px) scale(1.012); }
  }
  .pig.is-chewing { animation: chew .16s ease-in-out 6; }
  @keyframes chew {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(3px); }
  }

  /* 小猪的表情切换：默认全隐藏，按 data-face 显示 */
  .eyes, .mouth { display: none; }
  .pig[data-face="open"]  .eyes--open,
  .pig[data-face="happy"] .eyes--happy,
  .pig[data-face="sad"]   .eyes--sad,
  .pig[data-face="sleep"] .eyes--sleep { display: block; }
  .pig[data-mouth="idle"]  .mouth--idle,
  .pig[data-mouth="smile"] .mouth--smile,
  .pig[data-mouth="sad"]   .mouth--sad,
  .pig[data-mouth="open"]  .mouth--open { display: block; }
  /* 眨眼优先级最高，放在最后 */
  .pig.is-blinking .eyes { display: none; }
  .pig.is-blinking .eyes--blink { display: block; }

  /* ==== 对话气泡 ==== */
  .bubble {
    position: absolute; left: 50%; bottom: 97%;
    transform: translate(-50%, 6px);
    padding: 8px 14px; border-radius: 14px;
    background: #fff; border: 1px solid var(--line-2);
    font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--ink);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .bubble.is-on { opacity: 1; transform: translate(-50%, 0); }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px;
    margin-left: -4px; background: #fff;
    border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
    transform: rotate(45deg);
  }

  /* ==== 飘字 / 食物 ==== */
  .fx {
    position: absolute; left: 50%; top: 55%;
    font-size: 14px; font-weight: 600; color: var(--satiety);
    pointer-events: none; animation: fx-up .9s ease-out forwards;
  }
  .fx--mood { color: var(--mood); }
  .fx--bad  { color: #C98A5E; }
  @keyframes fx-up {
    from { opacity: 1; transform: translate(-50%, 0); }
    to   { opacity: 0; transform: translate(-50%, -46px); }
  }
  .food { position: absolute; left: 50%; top: 57%; margin-left: -11px; }
  .food > svg { animation: food-x .64s linear forwards; }
  .food > svg > g { animation: food-y .64s cubic-bezier(.45,0,.85,.55) forwards; }
  @keyframes food-x { from { transform: translateX(-52px) rotate(-40deg); } to { transform: translateX(0) rotate(0); } }
  @keyframes food-y { from { transform: translateY(-170px); } to { transform: translateY(2px); } }

  /* ==== 按钮区 ====
     为什么这里的 background / color / border-color 全带 !important、并且用 #id 选择器：
     按钮是页面上唯一「底色一旦被外部样式抹掉就彻底看不见」的元素（白底 + 白字 = 隐形）。
     这个页面会被嵌进宿主预览面板、也可能被浏览器深色插件改写样式，那些外来规则
     常常正好卡在 .btn--feed(0,1,0) 和 :hover(0,3,0) 之间的特异度上 ——
     表现就是「鼠标移上去才看得见」。这里用 #id + !important 把按钮底色钉死。
     注意：只钉 color / background / border-color，不要碰 width 等 JS 会写的属性。 */
  .actions { display: flex; gap: 10px; }
  .actions > .btn { flex: 1; }
  .actions > .btn--feed { flex: 1.5; }     /* 必须写在上面那条之后，否则被 flex:1 覆盖 */

  #feedBtn, #petBtn, #sleepBtn {
    background: #FFFFFF !important;
    color: #3A3238 !important;
    border-color: #DBD3CE !important;
  }
  #feedBtn {
    background: var(--satiety, #D98D9E) !important;
    color: #FFFFFF !important;
    border-color: var(--satiety, #D98D9E) !important;
  }
  #feedBtn:hover:not(:disabled) {
    background: #CE7C90 !important;
    border-color: #CE7C90 !important;
  }
  #feedBtn:active:not(:disabled) {
    background: #C06F83 !important;
    border-color: #C06F83 !important;
  }
  #petBtn:hover:not(:disabled) { border-color: var(--satiety, #D98D9E) !important; color: #B9667A !important; }
  #sleepBtn:hover:not(:disabled) { border-color: var(--mood, #9DC0AE) !important; }
  #sleepBtn.is-on {
    background: #EEF4F0 !important;
    color: #4E7A67 !important;
    border-color: var(--mood, #9DC0AE) !important;
  }
  /* 冷却中也要看得出是「禁用」而不是「隐形」：降透明度但仍保留底色 */
  #feedBtn:disabled, #petBtn:disabled, #sleepBtn:disabled { opacity: .55 !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<main class="app">

  <header class="top">
    <div>
      <div class="top__name">小猪</div>
      <div class="top__meta" id="meta">第 1 天 · 已喂 0 次</div>
    </div>
    <button class="top__reset" id="resetBtn" type="button">重新开始</button>
  </header>

  <section class="stats">
    <div>
      <div class="stat__row">
        <span class="stat__label">饱食度</span>
        <span class="stat__val" id="satietyVal">60</span>
      </div>
      <div class="bar bar--satiety"><i id="satietyBar"></i></div>
    </div>
    <div>
      <div class="stat__row">
        <span class="stat__label">心情</span>
        <span class="stat__val" id="moodVal">80</span>
      </div>
      <div class="bar bar--mood"><i id="moodBar"></i></div>
    </div>
    <div class="stat--weight">
      <div class="stat__label" style="margin-bottom:7px">体重</div>
      <div class="stat__num"><span id="weightVal">25.0</span><small>kg</small></div>
    </div>
  </section>

  <section class="stage">
    <span class="cloud" aria-hidden="true"></span>

    <div class="pig-wrap" id="pigWrap">
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>

      <div class="pig__bob">
        <svg class="pig" id="pig" viewBox="0 0 200 214" data-face="open" data-mouth="idle"
             role="img" aria-label="一只卡通小猪">
          <!-- 卷尾巴 -->
          <g id="tail">
            <path d="M150 148 c 16 -14 34 -4 30 12 c -3 12 -22 12 -25 1 c -2 -8 8 -13 14 -8"
                  fill="none" stroke="#D98D9E" stroke-width="6.5" stroke-linecap="round"/>
          </g>
          <!-- 后腿 -->
          <rect id="legL" x="72" y="184" width="24" height="26" rx="11" fill="#D98D9E" stroke="#B97A8B" stroke-width="2.5"/>
          <rect id="legR" x="104" y="184" width="24" height="26" rx="11" fill="#D98D9E" stroke="#B97A8B" stroke-width="2.5"/>
          <!-- 耳朵（在头后面） -->
          <path id="earL" d="M66 46 C 58 32 50 20 47 13 C 62 11 80 22 90 34 Z"
                fill="#D98D9E" stroke="#B97A8B" stroke-width="2.5" stroke-linejoin="round"/>
          <path id="earR" d="M134 46 C 142 32 150 20 153 13 C 138 11 120 22 110 34 Z"
                fill="#D98D9E" stroke="#B97A8B" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- 身体 -->
          <ellipse id="pigBody" cx="100" cy="150" rx="52" ry="45" fill="#E8AEB8" stroke="#B97A8B" stroke-width="2.5"/>
          <!-- 头 -->
          <ellipse id="pigHead" cx="100" cy="80" rx="55" ry="54" fill="#E8AEB8" stroke="#B97A8B" stroke-width="2.5"/>
          <!-- 腮红 -->
          <ellipse cx="60" cy="98" rx="9" ry="6" fill="#D98D9E" opacity=".45"/>
          <ellipse cx="140" cy="98" rx="9" ry="6" fill="#D98D9E" opacity=".45"/>
          <!-- 猪鼻 -->
          <ellipse id="pigSnout" cx="100" cy="96" rx="23" ry="17" fill="#D98D9E"/>
          <ellipse cx="92" cy="96" rx="3.6" ry="5.6" fill="#A8687B"/>
          <ellipse cx="108" cy="96" rx="3.6" ry="5.6" fill="#A8687B"/>
          <!-- 嘴巴 -->
          <g class="mouth mouth--idle">
            <path d="M93 122 Q 100 126 107 122" fill="none" stroke="#B97A8B" stroke-width="3" stroke-linecap="round"/>
          </g>
          <g class="mouth mouth--smile">
            <path d="M91 119 Q 100 128 109 119" fill="none" stroke="#B97A8B" stroke-width="3" stroke-linecap="round"/>
          </g>
          <g class="mouth mouth--sad">
            <path d="M91 125 Q 100 118 109 125" fill="none" stroke="#B97A8B" stroke-width="3" stroke-linecap="round"/>
          </g>
          <g class="mouth mouth--open">
            <ellipse cx="100" cy="122" rx="6.5" ry="5" fill="#A8687B"/>
          </g>
          <!-- 眼睛：睁开 -->
          <g class="eyes eyes--open">
            <ellipse cx="76" cy="70" rx="6.5" ry="7.5" fill="#4A3C42"/>
            <ellipse cx="124" cy="70" rx="6.5" ry="7.5" fill="#4A3C42"/>
            <circle cx="78.4" cy="67" r="2.4" fill="#fff"/>
            <circle cx="126.4" cy="67" r="2.4" fill="#fff"/>
          </g>
          <!-- 眼睛：眯眼笑 -->
          <g class="eyes eyes--happy">
            <path d="M69 69 Q 76 77 83 69" fill="none" stroke="#4A3C42" stroke-width="3.6" stroke-linecap="round"/>
            <path d="M117 69 Q 124 77 131 69" fill="none" stroke="#4A3C42" stroke-width="3.6" stroke-linecap="round"/>
          </g>
          <!-- 眼睛：难过（睁眼 + 耷拉眉毛 + 泪珠） -->
          <g class="eyes eyes--sad">
            <ellipse cx="76" cy="72" rx="6" ry="7" fill="#4A3C42"/>
            <ellipse cx="124" cy="72" rx="6" ry="7" fill="#4A3C42"/>
            <circle cx="78.2" cy="69" r="2.2" fill="#fff"/>
            <circle cx="126.2" cy="69" r="2.2" fill="#fff"/>
            <path d="M66 58 L84 63" fill="none" stroke="#B97A8B" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M134 58 L116 63" fill="none" stroke="#B97A8B" stroke-width="3.2" stroke-linecap="round"/>
            <ellipse cx="132" cy="88" rx="3" ry="4.2" fill="#9DC0AE" opacity=".85"/>
          </g>
          <!-- 眼睛：睡着 -->
          <g class="eyes eyes--sleep">
            <path d="M69 73 Q 76 65 83 73" fill="none" stroke="#4A3C42" stroke-width="3.6" stroke-linecap="round"/>
            <path d="M117 73 Q 124 65 131 73" fill="none" stroke="#4A3C42" stroke-width="3.6" stroke-linecap="round"/>
          </g>
          <!-- 眼睛：眨眼 -->
          <g class="eyes eyes--blink">
            <path d="M69 70 L83 70" fill="none" stroke="#4A3C42" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M117 70 L131 70" fill="none" stroke="#4A3C42" stroke-width="3.4" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <div id="fxLayer"></div>
    </div>
  </section>

  <footer class="actions">
    <button class="btn btn--feed" id="feedBtn" type="button">喂食</button>
    <button class="btn" id="petBtn" type="button">摸摸</button>
    <button class="btn btn--sleep" id="sleepBtn" type="button">睡觉</button>
  </footer>

</main>

<script>
(function () {
  'use strict';

  /* ======================= 参数：想调节奏改这里 ======================= */
  const CFG = {
    decayAwake:  0.8,    // 饱食度每秒下降（清醒）
    decaySleep:  0.32,   // 睡觉时降得慢
    moodUp:      0.12,   // 吃饱（饱食度>60）时心情每秒回升
    moodDown:    0.4,    // 饿坏（饱食度<30）时心情每秒下降
    feedGain:    22,     // 一次喂食 +饱食度
    feedMood:    3,
    feedWeight:  0.25,
    feedCool:    1200,   // 喂食冷却 ms
    fullLine:    95,     // 超过这个值再喂就算撑着
    petMood:     4,
    petCool:     2000,
    hungerLine:  25,     // 低于此值开始喊饿
    sadMoodLine: 30
  };

  const KEY = 'pigsite.v1';
  const $ = id => document.getElementById(id);

  const el = {
    meta: $('meta'), satietyVal: $('satietyVal'), satietyBar: $('satietyBar'),
    moodVal: $('moodVal'), moodBar: $('moodBar'), weightVal: $('weightVal'),
    pig: $('pig'), pigWrap: $('pigWrap'), tail: $('tail'), earL: $('earL'), earR: $('earR'),
    bubble: $('bubble'), fx: $('fxLayer'),
    feedBtn: $('feedBtn'), petBtn: $('petBtn'), sleepBtn: $('sleepBtn'), resetBtn: $('resetBtn')
  };

  /* ======================= 状态 ======================= */
  const blank = () => ({
    satiety: 60, mood: 80, weight: 25, fed: 0,
    start: Date.now(), last: Date.now(), sleeping: false
  });

  let s = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) s = Object.assign(blank(), JSON.parse(raw));
  } catch (e) { /* 隐私模式等读写失败，就用默认值 */ }

  /* 离线补算：按真实经过的时间把状态推进一遍。
     页面加载、以及从后台切回来时都会调用它。 */
  function simulate(sec) {
    sec = Math.min(sec, 12 * 3600);                 // 最多补算 12 小时
    const decay = s.sleeping ? CFG.decaySleep : CFG.decayAwake;
    const before = s.satiety;
    const after = Math.max(0, before - decay * sec);
    if (before > 60 && after > 60) s.mood = Math.min(100, s.mood + CFG.moodUp * sec);
    else if (before < 30 && after < 30) s.mood = Math.max(0, s.mood - CFG.moodDown * sec);
    s.satiety = after;
  }

  /* 离线补算：离开期间按真实时间把状态推进一遍 */
  const awaySec = Math.max(0, (Date.now() - s.last) / 1000);
  if (awaySec > 5) simulate(awaySec);
  s.sleeping = false;              // 回来就醒了
  s.last = Date.now();

  /* ======================= 表情 & 文案 ======================= */
  let chewing = 0;                 // 咀嚼截止时间戳
  const faceOf = () => {
    if (s.sleeping) return 'sleep';
    if (s.satiety < CFG.sadMoodLine || s.mood < CFG.sadMoodLine) return 'sad';
    if (s.mood > 60 && s.satiety > 45) return 'happy';
    return 'open';
  };
  const mouthOf = () => {
    if (s.sleeping) return 'idle';
    const f = faceOf();
    if (f === 'sad') return 'sad';
    if (f === 'happy') return 'smile';
    return 'idle';
  };

  let bubbleTimer = 0;
  function say(text, ms) {
    el.bubble.textContent = text;
    el.bubble.classList.add('is-on');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => el.bubble.classList.remove('is-on'), ms || 2200);
  }

  function floatText(text, cls) {
    const d = document.createElement('div');
    d.className = 'fx' + (cls ? ' ' + cls : '');
    d.textContent = text;
    el.fx.appendChild(d);
    setTimeout(() => d.remove(), 900);
  }

  /* ======================= 动作 ======================= */
  let feedLock = 0, petLock = 0;

  function dropFood() {
    const d = document.createElement('div');
    d.className = 'food';
    d.innerHTML = '<svg width="22" height="24" viewBox="0 0 22 24">' +
      '<path d="M11 5 C 6 5 3 8.5 3 13 C 3 18 6.5 22 11 22 C 15.5 22 19 18 19 13 C 19 8.5 16 5 11 5 Z" fill="#C96A6A"/>' +
      '<path d="M11 5 C 11 3 12 1.5 14 1" fill="none" stroke="#7E9A6E" stroke-width="2" stroke-linecap="round"/>' +
      '<path d="M11 4 C 8 4 6 2.5 6 1 C 9 1 11 2 11 4 Z" fill="#8FAE7E"/></svg>';
    el.pigWrap.appendChild(d);
    const inner = d.firstChild;
    const done = () => { d.remove(); startChew(); };
    inner.addEventListener('animationend', done, { once: true });
    setTimeout(() => { if (d.isConnected) done(); }, 900);   // 兜底
  }

  function startChew() {
    chewing = Date.now() + 900;
    el.pig.classList.remove('is-chewing');
    void el.pig.offsetWidth;                                  // 重启动画
    el.pig.classList.add('is-chewing');
    setTimeout(() => el.pig.classList.remove('is-chewing'), 1000);
  }

  function feed() {
    const now = Date.now();
    if (now < feedLock) return;
    feedLock = now + CFG.feedCool;

    if (s.satiety >= CFG.fullLine) {
      s.mood = Math.max(0, s.mood - 6);
      say('呃…吃不下了');
      floatText('-6 心情', 'fx--bad');
      startChew();
      flash(el.feedBtn, CFG.feedCool);
      return;
    }
    s.satiety = Math.min(100, s.satiety + CFG.feedGain);
    s.mood = Math.min(100, s.mood + CFG.feedMood);
    s.weight += CFG.feedWeight;
    s.fed += 1;

    dropFood();
    floatText('+' + CFG.feedGain + ' 饱食度');
    say('噜噜～谢谢！');
    flash(el.feedBtn, CFG.feedCool);
  }

  function pet() {
    const now = Date.now();
    if (now < petLock) return;
    petLock = now + CFG.petCool;
    s.mood = Math.min(100, s.mood + CFG.petMood);
    floatText('+' + CFG.petMood + ' 心情', 'fx--mood');
    say('嘿嘿～');
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'fx fx--mood';
        h.style.left = (30 + Math.random() * 40) + '%';
        h.textContent = '♥';
        el.fx.appendChild(h);
        setTimeout(() => h.remove(), 900);
      }, i * 130);
    }
    flash(el.petBtn, CFG.petCool);
  }

  function toggleSleep() {
    s.sleeping = !s.sleeping;
    el.sleepBtn.classList.toggle('is-on', s.sleeping);
    say(s.sleeping ? 'Zzz…' : '睡醒啦！');
  }

  function flash(btn, ms) {
    btn.disabled = true;
    setTimeout(() => { btn.disabled = false; }, ms);
  }

  /* ======================= 每帧推进 ======================= */
  function tick(dt) {
    const d = s.sleeping ? CFG.decaySleep : CFG.decayAwake;
    s.satiety = Math.max(0, s.satiety - d * dt);

    if (s.sleeping) {
      s.mood = Math.min(100, s.mood + 0.25 * dt);
    } else if (s.satiety > 60) {
      s.mood = Math.min(100, s.mood + CFG.moodUp * dt);
    } else if (s.satiety < 30) {
      s.mood = Math.max(0, s.mood - CFG.moodDown * dt);
    }
  }

  /* 数值跨过阈值时的提示，只在跨过的那一刻说一次 */
  let saidHungry = false, saidFat = false;
  function checkThresholds() {
    if (s.satiety < CFG.hungerLine && !saidHungry) { saidHungry = true; say('咕…有点饿了'); }
    if (s.satiety > 55) saidHungry = false;
    if (s.weight > 40 && !saidFat) { saidFat = true; say('我是不是该减肥了…'); }
  }

  /* ======================= 渲染 ======================= */
  let lastFace = '', lastMouth = '';

  function render() {
    const wall = Date.now();          // 逻辑用绝对时间
    const ph = performance.now();     // 动画相位用单调时间（数值小，sin 精度才够）

    el.satietyVal.textContent = Math.round(s.satiety);
    el.moodVal.textContent = Math.round(s.mood);
    el.satietyBar.style.width = s.satiety + '%';
    el.moodBar.style.width = s.mood + '%';
    el.weightVal.textContent = s.weight.toFixed(1);

    const days = Math.floor((wall - s.start) / 86400000) + 1;
    el.meta.textContent = '第 ' + days + ' 天 · 已喂 ' + s.fed + ' 次';

    /* 表情 */
    const face = faceOf();
    if (face !== lastFace) { el.pig.dataset.face = face; lastFace = face; }
    const mouth = (wall < chewing)
      ? (Math.floor((chewing - wall) / 130) % 2 ? 'idle' : 'open')
      : mouthOf();
    if (mouth !== lastMouth) { el.pig.dataset.mouth = mouth; lastMouth = mouth; }

    /* 尾巴：绕自身根部旋转，用属性设 transform 最稳 */
    const wag = Math.sin(ph / (face === 'happy' ? 260 : 520)) * (face === 'happy' ? 11 : 6);
    el.tail.setAttribute('transform', 'rotate(' + wag.toFixed(2) + ' 150 148)');

    /* 耳朵耷拉 */
    const droop = (face === 'sad' || s.sleeping) ? 16 : 0;
    el.earL.setAttribute('transform', 'rotate(' + droop + ' 66 46)');
    el.earR.setAttribute('transform', 'rotate(' + (-droop) + ' 134 46)');

    /* 越胖越宽 */
    el.pigWrap.style.setProperty('--fat', (1 + Math.min(Math.max(s.weight - 25, 0), 25) * 0.006).toFixed(3));
  }

  /* ======================= 眨眼 ======================= */
  function scheduleBlink() {
    setTimeout(() => {
      if (!s.sleeping) {
        el.pig.classList.add('is-blinking');
        setTimeout(() => el.pig.classList.remove('is-blinking'), 150);
      }
      scheduleBlink();
    }, 2400 + Math.random() * 3000);
  }

  /* ======================= 持久化 & 主循环 ======================= */
  let lastWall = Date.now(), saveAt = 0;

  function save() {
    s.last = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  /* 用「挂钟时间」驱动，而不是累加帧间隔：
     标签页切到后台时 rAF 会被浏览器暂停，用挂钟才不会白丢那段时间。
     同时挂一个 1 秒心跳兜底，双保险（dt 从挂钟算，重复调用不会重复计数）。 */
  function frame() {
    const wall = Date.now();
    let dt = (wall - lastWall) / 1000;
    if (dt <= 0) return;
    lastWall = wall;
    tick(Math.min(dt, 1));           // 单帧最多推进 1 秒，避免长时间暂停后猛跳
    render();
    checkThresholds();
    if (wall - saveAt > 5000) { saveAt = wall; save(); }
  }

  function rafLoop() { frame(); requestAnimationFrame(rafLoop); }

  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); return; }
    /* 切回来时补上没被计到的时间 */
    const gap = (Date.now() - lastWall) / 1000;
    if (gap > 3) { simulate(gap); lastWall = Date.now(); s.last = Date.now(); }
  });

  /* ======================= 绑定 ======================= */
  el.feedBtn.addEventListener('click', feed);
  el.petBtn.addEventListener('click', pet);
  el.sleepBtn.addEventListener('click', toggleSleep);
  el.resetBtn.addEventListener('click', () => {
    if (!confirm('重新开始？小猪会变回刚出生的样子。')) return;
    s = blank();
    saidHungry = saidFat = false;
    lastFace = lastMouth = '';
    save();
    say('我出生啦！');
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (document.activeElement === document.body) { e.preventDefault(); feed(); }
    }
  });

  /* ======================= 启动 ======================= */
  render();
  scheduleBlink();
  setInterval(frame, 1000);          // 心跳兜底：即使 rAF 被暂停也会按时推进
  requestAnimationFrame(rafLoop);

  if (awaySec > 300) {
    const t = awaySec < 3600 ? Math.round(awaySec / 60) + ' 分钟'
                             : Math.round(awaySec / 3600) + ' 小时';
    setTimeout(() => say(s.satiety < CFG.hungerLine ? '你走了 ' + t + '…我饿坏了' : '你回来啦！', 3600), 500);
  }
})();
</script>
</body>
</html>
